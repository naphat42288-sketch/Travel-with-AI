<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>โครงงานระบบวางแผนท่องเที่ยวอัจฉริยะด้วย AI - Presentation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #090d16, #0f172a, #1e1b4b);
            color: white;
            min-height: 100vh;
            scroll-behavior: smooth;
        }

        /* NAVBAR */
        nav {
            max-width: 1200px;
            margin: auto;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #3b82f6;
        }

        .badge {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            color: #60a5fa;
            font-weight: 500;
        }

        /* PRESENTATION HERO COVER */
        .presentation-cover { 
            text-align: center;
            max-width: 900px;
            margin: 60px auto 40px;
            padding: 20px;
        }

        .academic-tag {
            font-size: 14px;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 4px;
        }

        .presentation-cover h1 {
            font-size: clamp(32px, 5vw, 56px);
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .presentation-cover h1 span {
            background: linear-gradient(90deg, #3b82f6, #a78bfa);
            -webkit-background-clip: text;
            color: transparent;
        }

        .presentation-cover p.subtitle {
            color: #94a3b8;
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }

        /* STUDENT CREDENTIALS CARD */
        .credentials-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            max-width: 600px;
            margin: 0 auto 50px;
            text-align: left;
            backdrop-filter: blur(10px);
        }

        .credentials-title {
            font-size: 14px;
            color: #3b82f6;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .credentials-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 10px 15px;
            font-size: 15px;
        }

        .credentials-label {
            color: #64748b;
            font-weight: 500;
        }

        .credentials-value {
            color: #cbd5e1;
        }

        /* CONTAINER */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        /* PRESENTATION SLIDES SECTION */
        .section-title {
            text-align: center;
            margin: 60px 0 30px;
        }

        .section-title h2 {
            font-size: 32px;
            font-weight: 600;
        }

        .section-title p {
            color: #94a3b8;
            font-size: 16px;
            margin-top: 5px;
        }

        .slides-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-bottom: 60px;
        }

        .slide-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .slide-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.1);
        }

        .slide-num {
            font-size: 14px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 15px;
            display: block;
        }

        .slide-card h3 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #f8fafc;
        }

        .slide-card ul {
            list-style-type: none;
        }

        .slide-card li {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
            position: relative;
            padding-left: 18px;
        }

        .slide-card li::before {
            content: "•";
            color: #3b82f6;
            font-weight: bold;
            font-size: 16px;
            position: absolute;
            left: 0;
            top: -2px;
        }

        /* LIVE DEMO BLOCK WRAPPER */
        .demo-anchor {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.1), rgba(167, 139, 250, 0.1));
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 40px;
        }

        .demo-anchor h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .demo-btn-scroll {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 10px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            margin-top: 10px;
            transition: 0.2s;
        }

        .demo-btn-scroll:hover {
            background: #2563eb;
        }

        /* MAIN DEMO CARD */
        .card {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            margin-bottom: 60px;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h2 {
            font-size: 32px;
            color: #f8fafc;
        }

        .title p {
            color: #94a3b8;
            margin-top: 8px;
        }

        /* FORM */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        /* BUTTON */
        .create-btn {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            color: white;
            font-family: inherit;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        /* LOADING */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
            color: #93c5fd;
        }

        .spinner {
            display: inline-block;
            width: 35px;
            height: 35px;
            border: 4px solid #1e293b;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 
            to {
                transform: rotate(360deg);
            }
        }

        /* RESULT */
        .result {
            display: none;
            margin-top: 35px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 35px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .result-header h2 {
            font-size: 28px;
        }

        /* SUMMARY */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
        }

        .summary-card .icon {
            font-size: 25px;
        }

        .summary-card p {
            color: #94a3b8;
            font-size: 14px;
        }

        .summary-card h3 {
            font-size: 22px;
            margin-top: 4px;
        }

        /* ITINERARY */
        .day {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 15px;
        }

        .day-title {
            color: #60a5fa;
            font-size: 21px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .activity {
            display: flex;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #1e293b;
        }

        .activity:last-child {
            border-bottom: none;
        }

        .time {
            min-width: 70px;
            color: #c084fc;
            font-weight: 500;
        }

        .activity p {
            color: #e2e8f0;
        }

        .activity small {
            color: #64748b;
        }

        /* FOOTER */
        footer {
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px 20px;
            color: #64748b;
            margin-top: 80px;
            font-size: 14px;
        }

        footer small {
            display: block;
            margin-top: 8px;
            color: #475569;
        }

        /* RESPONSIVE */
        @media(max-width: 900px) {
            .slides-container {
                grid-template-columns: 1fr;
            }
            .form-grid,
            .summary {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
